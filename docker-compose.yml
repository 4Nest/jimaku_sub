services:
  jimaku-subscriber:
    # CI 发布到 GHCR 的镜像；本地/服务器无镜像时回退到 build
    image: ghcr.io/4nest/jimaku_sub:latest
    build: .
    container_name: jimaku-subscriber
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - RUST_LOG=${RUST_LOG:-info,teloxide=warn}
      - LOG_DIR=/app/logs
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - DATABASE_URL=sqlite:///app/data/jimaku_subscriber.db
      # 必需配置
      - JIMAKU_API_KEY=${JIMAKU_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # 可选配置
      - DOWNLOAD_ENABLED=${DOWNLOAD_ENABLED:-false}
      - DOWNLOAD_PATH=${DOWNLOAD_PATH:-/app/downloads}
      #- SCHEDULER_INTERVAL_SECONDS=300
      #- SUBSCRIPTION_ANILIST_IDS=16498,1535
      #- SUBSCRIPTION_NAME_KEYWORDS=Attack on Titan,Shingeki
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    healthcheck:
      # 心跳文件由调度器每轮成功检查后刷新；15 分钟内无心跳视为异常
      test: ["CMD-SHELL", "test -f /tmp/jimaku_heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/jimaku_heartbeat) )) -lt 900"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 也可以挂载配置文件
    # - ./config.toml:/app/config.toml:ro
