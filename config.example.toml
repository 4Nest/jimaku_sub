# Jimaku 字幕订阅服务配置示例

[jimaku]
api_key = "your_jimaku_api_key_here"
base_url = "https://jimaku.cc"

[telegram]
bot_token = "your_telegram_bot_token_here"
chat_id = "your_chat_id_here"

[subscription]
# 空列表 = 不匹配任何条目（全量推送请用 [channel] 频道功能）
anilist_ids = []
name_keywords = []

[download]
enabled = false
download_path = "/app/downloads"

[scheduler]
interval_seconds = 300

[database]
url = "sqlite://data/jimaku_subscriber.db"

[logging]
dir = "./logs"
retention_days = 30

# 全量字幕频道推送：jimaku 全站新字幕直接以文件发到频道
# 需要把 bot 加为频道管理员（发布消息权限），chat_id 为数字频道 id（-100 开头）
[channel]
enabled = false
chat_id = ""
